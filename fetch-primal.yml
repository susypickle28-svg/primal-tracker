name: Fetch #primal count

on:
  schedule:
    - cron: '0 0 * * *'  # ogni giorno a mezzanotte UTC
  workflow_dispatch:       # permette di avviarlo anche manualmente

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Fetch #primal data from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node fetch-primal.js

      - name: Commit and push data
        run: |
          git config user.name "primal-bot"
          git config user.email "bot@primal.tracker"
          git add data.json
          git diff --cached --quiet || git commit -m "📊 Auto-update #primal $(date +'%Y-%m-%d')"
          git push
