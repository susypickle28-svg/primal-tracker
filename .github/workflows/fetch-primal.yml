name: Fetch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install apify-client

      - name: Fetch data and update
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node fetch-primal.js

      # ⚠️ FORZA l'aggiornamento del timestamp – così il file cambia sempre
      - name: Force update timestamp in data.json
        run: |
          jq '. + { "lastGitUpdate": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'" }' data.json > data.tmp && mv data.tmp data.json

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "📊 Update #primal $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
